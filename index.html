<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/rtec-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Rangpur Textile Engineering College (RTEC) | 3D Interactive Campus & Alumni Portal</title>
    <meta name="description" content="Official 3D Interactive Campus Tour and Alumni Platform for Rangpur Textile Engineering College, Pirganj, Rangpur." />
    
    <!-- Google Fonts: Cormorant Garamond & Cinzel (Editorial Display Serif) + Hind Siliguri (Bengali) + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Synchronous Theme Pre-Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rtec_theme') || 'light';
          var root = document.documentElement;
          if (saved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#121110] text-[#EDE8DF] antialiased selection:bg-[#C5A880] selection:text-[#121110]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
